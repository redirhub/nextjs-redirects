name: Release

# Publishes to npm when a version tag (v0.1.0) is pushed, through npm Trusted Publishing:
# no token is stored; npm trusts this workflow of this repository (package settings on
# npmjs.com → Trusted Publisher) and adds a provenance statement to the release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: The tag is package.json's version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      # prepublishOnly runs the typecheck, the tests and the build.
      - run: npm publish
