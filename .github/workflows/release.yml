name: Release

# Releases what main says: when package.json's version has no v<version> tag yet, this checks,
# publishes to npm, then tags the commit and creates the GitHub Release. To release, bump the
# version (package.json and src/version.ts) and merge; nobody pushes a tag by hand.
#
# npm Trusted Publishing: no token is stored; npm trusts this workflow file of this repository
# (package settings on npmjs.com → Trusted Publisher, workflow release.yml) and adds provenance.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version to release
        id: version
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version is already released"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted Publishing needs npm 11.5.1 or later.
      - if: steps.version.outputs.new == 'true'
        run: npm install -g npm@latest
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      # prepublishOnly runs the typecheck, the tests and the build first.
      - if: steps.version.outputs.new == 'true'
        run: npm publish
      - if: steps.version.outputs.new == 'true'
        name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
